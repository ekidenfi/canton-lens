{{- if .Values.frontend.enabled }}
{{- include "canton-lens.validateAuthModes" . -}}
{{- $basePath := include "canton-lens.basePath" . -}}
{{- $backendUrl := printf "http://%s:%v" (include "canton-lens.backendHost" .) (.Values.backend.service.port | int) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "canton-lens.frontendFullname" . }}-nginx
  labels:
    {{- include "canton-lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    # Managed by the canton-lens Helm chart. Mirrors docker/nginx.conf:
    # one origin in front of two workloads. This server terminates no TLS, holds no
    # session, and makes no authentication decision — it matches a path and forwards.
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        server_tokens off;

        gzip on;
        gzip_min_length 1024;
        gzip_types application/javascript application/json text/css image/svg+xml;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Backend-owned routes. The Authorization header passes through untouched.
        location {{ $basePath }}/api/ {
            proxy_pass {{ $backendUrl }};
        }

        location = {{ $basePath }}/openapi.json {
            proxy_pass {{ $backendUrl }};
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
{{- end }}
