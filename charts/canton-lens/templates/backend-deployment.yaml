{{- include "canton-lens.validateAuthModes" . -}}
{{- $probePath := printf "%s/openapi.json" (include "canton-lens.basePath" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "canton-lens.backendFullname" . }}
  labels:
    {{- include "canton-lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "canton-lens.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/backend-secret.yaml") . | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "canton-lens.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "canton-lens.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.backend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ printf "%s:%s" .Values.backend.image.repository (.Values.backend.image.tag | default "latest") | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          env:
            - name: LEDGER_AUTH_MODE
              value: {{ .Values.config.ledgerAuthMode | quote }}
            - name: LEDGER_BASE
              value: {{ .Values.config.ledgerBase | quote }}
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: {{ .Values.backend.port | quote }}
            {{- $basePath := include "canton-lens.basePath" . }}
            {{- if ne $basePath "" }}
            - name: BASE_PATH
              value: {{ $basePath | quote }}
            {{- end }}
            {{- if ne (default "" .Values.config.publicEntryUrl) "" }}
            - name: PUBLIC_ENTRY_URL
              value: {{ .Values.config.publicEntryUrl | quote }}
            {{- end }}
            {{- if eq .Values.config.ledgerAuthMode "shared-identity" }}
            - name: SHARED_IDENTITY_ISSUER
              value: {{ .Values.config.sharedIdentity.issuer | quote }}
            - name: SHARED_IDENTITY_CLIENT_ID
              value: {{ .Values.config.sharedIdentity.clientId | quote }}
            - name: SHARED_IDENTITY_SCOPES
              value: {{ .Values.config.sharedIdentity.scopes | quote }}
            {{- if ne (default "" .Values.config.sharedIdentity.audience) "" }}
            - name: SHARED_IDENTITY_AUDIENCE
              value: {{ .Values.config.sharedIdentity.audience | quote }}
            {{- end }}
            {{- if ne (default "" .Values.config.sharedIdentity.insecureHttpHosts) "" }}
            - name: SHARED_IDENTITY_INSECURE_HTTP_HOSTS
              value: {{ .Values.config.sharedIdentity.insecureHttpHosts | quote }}
            {{- end }}
            - name: SHARED_IDENTITY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "canton-lens.sharedIdentitySecretName" . }}
                  key: {{ default "client-secret" .Values.config.sharedIdentity.existingSecret.key }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ $probePath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ $probePath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
