{{- include "canton-lens.validateAuthModes" . -}}
{{- if and (eq .Values.config.ledgerAuthMode "shared-identity") (eq (default "" .Values.config.sharedIdentity.existingSecret.name) "") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "canton-lens.sharedIdentitySecretName" . }}
  labels:
    {{- include "canton-lens.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # Prefer --set-file or an external secret manager over --set for this value
  # (it appears in helm release state otherwise).
  client-secret: {{ required "config.sharedIdentity.clientSecret is required in shared-identity mode without existingSecret" .Values.config.sharedIdentity.clientSecret | quote }}
{{- end }}
