# Builds the Docker images and the Helm chart, pushes all of them to GHCR.
#
# Image names come from the repository (`ghcr.io/${{ github.repository }}-*`),
# never from a hardcoded owner — forks and renames keep working.
#
# What is published, and what is not:
# - `<repo>-backend` — fully generic (no build args), safe to reuse.
# - `<repo>-frontend:<profile>-*` for `shared-identity` and `institution-bff`,
#   whose bundles bake in nothing but VITE_AUTH_MODE (public by design).
# - `<repo>-frontend:browser-oidc-*` — bakes in the committed public env file
#   for the environment: `docker/.env.staging` on `main`,
#   `docker/.env.production` on `v*` tags. Those files carry only public
#   VITE_* values; the build refuses any `*SECRET*` line. A deployment with
#   its own issuer/client/redirects still builds its own frontend image
#   (one `docker build` command; see charts/canton-lens/README.md).
# - the `canton-lens` Helm chart to `oci://ghcr.io/<owner>/<repo>/charts`.
#
# Tag scheme (via docker/metadata-action):
# - `main` push (staging): `staging`, `staging-sha-<sha>` per image / profile;
#   chart `<Chart.yaml version>-staging.<run-number>` (e.g. `0.1.0-staging.42`).
# - version tag `v0.1.0` (prod): backend `0.1.0`, `0.1`, `sha-<sha>`, `latest`;
#   frontend keeps its `<profile>-` prefix (`shared-identity-0.1.0`,
#   `browser-oidc-latest`, ...); chart `0.1.0`.
# Manual runs (`workflow_dispatch`) build the selected environment's
# browser-oidc bundle and staging-tagged images.
name: Publish images and charts

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Which committed env file to bake into the browser-oidc image
        required: false
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    name: backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-backend
          tags: |
            type=raw,value=staging,enable={{is_default_branch}}
            type=raw,value=staging-sha-{{sha}},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-generic:
    name: frontend image (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only the profiles whose bundle carries no deployment-specific values.
        # browser-oidc bakes in issuer/client/redirect URIs and has its own job
        # below, fed by the committed per-environment env files.
        profile: [shared-identity, institution-bff]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-frontend
          flavor: |
            latest=false
            prefix=${{ matrix.profile }}-
          tags: |
            type=raw,value=staging,enable={{is_default_branch}}
            type=raw,value=staging-sha-{{sha}},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          # Only VITE_* values belong in build args, and these two profiles need only
          # the mode — all public by design. Never add a secret as a build arg: it is
          # recorded in image history, printed in build output and kept in the build cache.
          build-args: |
            VITE_AUTH_MODE=${{ matrix.profile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-browser-oidc:
    name: frontend image (browser-oidc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: target
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.environment }}" ]]; then
            echo "name=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=staging" >> "$GITHUB_OUTPUT"
          fi
      - name: Load public build values from the committed env file
        run: |
          FILE="docker/.env.${{ steps.target.outputs.name }}"
          test -f "$FILE" || { echo "missing $FILE"; exit 1; }
          if grep -qE '^[A-Z_]*SECRET' "$FILE"; then
            echo "refusing: $FILE must stay public-only (found a *SECRET* line)"
            exit 1
          fi
          grep -E '^VITE_AUTH_MODE=browser-oidc$' "$FILE" \
            || { echo "refusing: $FILE is not a browser-oidc env"; exit 1; }
          grep -E '^VITE_[A-Za-z_]+=.*' "$FILE" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-frontend
          flavor: |
            latest=false
            prefix=browser-oidc-
          tags: |
            type=raw,value=staging,enable={{is_default_branch}}
            type=raw,value=staging-sha-{{sha}},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          # Public by design: every value below lands in the browser bundle.
          # Sourced from docker/.env.staging or docker/.env.production, both
          # committed and secret-free by construction (checked above).
          build-args: |
            VITE_AUTH_MODE=${{ env.VITE_AUTH_MODE }}
            VITE_OIDC_ISSUER=${{ env.VITE_OIDC_ISSUER }}
            VITE_OIDC_CLIENT_ID=${{ env.VITE_OIDC_CLIENT_ID }}
            VITE_OIDC_REDIRECT_URI=${{ env.VITE_OIDC_REDIRECT_URI }}
            VITE_OIDC_POST_LOGOUT_REDIRECT_URI=${{ env.VITE_OIDC_POST_LOGOUT_REDIRECT_URI }}
            VITE_OIDC_SCOPES=${{ env.VITE_OIDC_SCOPES }}
            VITE_OIDC_AUDIENCE=${{ env.VITE_OIDC_AUDIENCE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: helm chart (OCI)
    runs-on: ubuntu-latest
    needs: [backend, frontend-generic, frontend-browser-oidc]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint ./charts/canton-lens
      - name: Package and push the chart
        run: |
          set -euo pipefail
          BASE="$(grep '^version:' charts/canton-lens/Chart.yaml | awk '{print $2}')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            CHART_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            CHART_VERSION="${BASE}-staging.${GITHUB_RUN_NUMBER}"
          fi
          APP_VERSION="$(git rev-parse --short HEAD)"
          mkdir -p /tmp/charts
          helm package charts/canton-lens \
            --version "$CHART_VERSION" --app-version "$APP_VERSION" \
            -d /tmp/charts
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "${{ env.REGISTRY }}" \
              -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/charts/canton-lens-${CHART_VERSION}.tgz" \
            "oci://${{ env.REGISTRY }}/${REPO_LC}/charts"
